<svg xmlns="http://www.w3.org/2000/svg" width="1520" height="560" viewBox="0 0 1520 560" role="img" aria-labelledby="title desc">
  <title id="title">ChurchCore</title>
  <desc id="desc">ChurchCore wordmark with the tagline: secure, multi-tenant church operations platform.</desc>
  <defs>
    <radialGradient id="glow" cx="78%" cy="30%" r="60%">
      <stop offset="0" stop-color="#6366f1" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="8%" cy="100%" r="45%">
      <stop offset="0" stop-color="#4f46e5" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#4f46e5" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#4f46e5"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1e293b" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1520" height="560" rx="28" fill="#020617"/>
  <rect width="1520" height="560" rx="28" fill="url(#grid)" opacity="0.55"/>
  <rect width="1520" height="560" rx="28" fill="url(#glow)"/>
  <rect width="1520" height="560" rx="28" fill="url(#glow2)"/>
  <rect x="1" y="1" width="1518" height="558" rx="27" fill="none" stroke="#1e293b" stroke-width="2"/>

  <!-- Mark: a simple cross inside a rounded square -->
  <g transform="translate(120 150)">
    <rect width="132" height="132" rx="32" fill="url(#mark)"/>
    <rect x="58" y="24" width="16" height="84" rx="6" fill="#eef2ff"/>
    <rect x="32" y="48" width="68" height="16" rx="6" fill="#eef2ff"/>
  </g>

  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
    <text x="290" y="246" fill="#f8fafc" font-size="104" font-weight="700" letter-spacing="-3">ChurchCore</text>
    <text x="294" y="300" fill="#a5b4fc" font-size="30" font-weight="500">Secure, multi-tenant church operations platform</text>

    <!-- Capability chips -->
    <g font-size="20" font-weight="500" fill="#cbd5e1">
      <g transform="translate(120 380)">
        <rect width="233" height="48" rx="24" fill="#0f172a" stroke="#334155"/>
        <text x="116" y="31" text-anchor="middle">People &amp; households</text>
      </g>
      <g transform="translate(369 380)">
        <rect width="203" height="48" rx="24" fill="#0f172a" stroke="#334155"/>
        <text x="101" y="31" text-anchor="middle">Service planning</text>
      </g>
      <g transform="translate(588 380)">
        <rect width="233" height="48" rx="24" fill="#0f172a" stroke="#334155"/>
        <text x="116" y="31" text-anchor="middle">Children's check-in</text>
      </g>
      <g transform="translate(837 380)">
        <rect width="244" height="48" rx="24" fill="#0f172a" stroke="#334155"/>
        <text x="122" y="31" text-anchor="middle">Giving &amp; statements</text>
      </g>
      <g transform="translate(1097 380)">
        <rect width="244" height="48" rx="24" fill="#0f172a" stroke="#334155"/>
        <text x="122" y="31" text-anchor="middle">Double-entry finance</text>
      </g>
    </g>

    <text x="120" y="490" fill="#64748b" font-size="20" font-weight="500">Row-level security on every church's data · control plane separated from the tenant app · communications, care, reports · AGPL-3.0</text>
  </g>

</svg>
